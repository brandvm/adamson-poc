<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hall Sound Waves</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300&display=swap" rel="stylesheet">
<style>
  :root { --bg:#000; --accent:#ab9981; }
  html,body { margin:0; height:100%; background:var(--bg); overflow:hidden; }
  .stage { position:fixed; inset:0; width:100vw; height:100vh; height:100dvh; background:#000; cursor:pointer;
           -webkit-tap-highlight-color:transparent; outline:none; }
  .stage:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); }
  .hint { position:absolute; left:50%; bottom:5%; transform:translateX(-50%); white-space:nowrap; pointer-events:none;
          padding:.9em 1.4em .9em 1.72em; border-radius:999px; background:rgba(0,0,0,.5); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
          font:300 clamp(10px,.9vw,13px)/1 'Outfit',system-ui,sans-serif; letter-spacing:.32em; text-transform:uppercase;
          color:#fff; opacity:.85; transition:opacity .8s ease; }
  .hint.gone { opacity:0; }
  .back { position:absolute; top:clamp(14px,3vh,28px); left:clamp(14px,2.5vw,32px); z-index:5;
          display:inline-flex; align-items:center; gap:.7em; padding:.6em 1.1em .6em 1em; border-radius:999px;
          border:1px solid rgba(171,153,129,.35); background:rgba(0,0,0,.35); color:#ab9981; text-decoration:none;
          font:300 clamp(10px,.85vw,12px)/1 'Outfit',system-ui,sans-serif; letter-spacing:.28em; text-transform:uppercase;
          -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); transition:border-color .2s ease, color .2s ease; }
  .back:hover { border-color:rgba(171,153,129,.8); color:#d8c7ad; }
  .back:focus-visible { outline:1px solid #ab9981; outline-offset:3px; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .fallback { position:absolute; inset:0; background:#000 url(hall-auditorium.webp) 55% 32% / cover no-repeat; display:none; }
</style>
</head>
<body>
<div class="stage" id="stage" tabindex="0" role="button" aria-label="Adamson line array in a concert hall. Activate to send a sound wave from the speaker.">
  <canvas id="gl" aria-hidden="true"></canvas>
  <div class="fallback" id="fallback"></div>
  <a class="back" href="./"><span aria-hidden="true">&larr;</span>Studies</a>
  <div class="hint" id="hint">Click to send a wave</div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const DUR    = 3.4;                       // seconds one wave takes to cross the hall
const MAXW   = 4;                         // waves that can overlap if clicked quickly
const IMG    = { w: 2000, h: 1105 };      // hall-auditorium.webp
const FOCUS  = { x: 1105, y: 352 };       // centre of the line array, image px
const ZOOM   = 1.0;                       // 1 = whole photo (cover); >1 pushes in on the product

const frag = /* glsl */`
precision highp float;
uniform sampler2D uImg;
uniform vec2  uImgSize, uRes, uCenter, uFocus;
uniform float uPx;      // image px per device px
uniform float uAge[${MAXW}];   // seconds since each wave was sent, < 0 = unused
uniform float uStill;
uniform float uBoost;         // QA only (?boost=4) — exaggerates the wave to check its shape         // 1 = reduced motion: ring fades in place instead of travelling
#define PI 3.14159265
#define DUR ${DUR.toFixed(3)}

vec2 toImg(vec2 frag){ vec2 d = frag - 0.5*uRes; d.y = -d.y; return uCenter + d*uPx; }
vec3 tap(vec2 ip, float lod){ return textureLod(uImg, clamp(ip/uImgSize, 0.001, 0.999), lod).rgb; }

// ---- the room's real surfaces, traced from the photo (image px, y down) ----
// Sound only reaches what the rig can "see": a surface stops the wave, the front presses flat
// along it and the surface lights up as it is struck. Chains of segments; the free ends of each
// chain are soft so the cut-off fans out gently instead of leaving a hard radial edge.
#define NSEG 19
const vec4 SEG[NSEG] = vec4[NSEG](
  // underside of the acoustic cloud the rig hangs from
  vec4( 560.,180.,  700.,245.), vec4( 700.,245.,  800.,275.), vec4( 800.,275.,  930.,296.),
  vec4( 930.,296., 1070.,292.), vec4(1070.,292., 1250.,250.), vec4(1250.,250., 1320.,200.),
  vec4(1320.,200., 1370.,110.), vec4(1370.,110., 1380., 30.),
  // left mid balcony front
  vec4( 260.,500.,  470.,565.), vec4( 470.,565.,  650.,600.),
  // left lower balcony front
  vec4( 390.,695.,  690.,780.),
  // stage-surround wall: back of the stage, curving down past the right seating
  vec4( 690.,780.,  950.,785.), vec4( 950.,785., 1180.,780.), vec4(1180.,780., 1300.,790.),
  vec4(1300.,790., 1500.,810.), vec4(1500.,810., 1700.,850.), vec4(1700.,850., 1800.,880.),
  // right seating front rail
  vec4(1760.,875., 1880.,838.), vec4(1880.,838., 2000.,800.)
);
// 1 = this end of the segment is a free chain end (soft), 0 = joined to the next segment
const vec2 SOFT[NSEG] = vec2[NSEG](
  vec2(1,0), vec2(0,0), vec2(0,0), vec2(0,0), vec2(0,0), vec2(0,0), vec2(0,0), vec2(0,1),
  vec2(1,0), vec2(0,1),
  vec2(1,1),
  vec2(1,0), vec2(0,0), vec2(0,0), vec2(0,0), vec2(0,0), vec2(0,1),
  vec2(1,0), vec2(0,1)
);
float segDist(vec2 p, vec2 a, vec2 b){ vec2 pa = p - a, ba = b - a; return length(pa - ba*clamp(dot(pa,ba)/dot(ba,ba), 0., 1.)); }
float cross2(vec2 a, vec2 b){ return a.x*b.y - a.y*b.x; }
// how much of P the source S can reach (1 = clear line of sight), and the distance to the nearest surface
vec2 sight(vec2 S, vec2 P){
  float blocked = 0., dS = 1e5;
  vec2 sp = P - S;
  for (int i = 0; i < NSEG; i++){
    vec2 a = SEG[i].xy, b = SEG[i].zw, ab = b - a;
    dS = min(dS, segDist(P, a, b));
    float den = cross2(sp, ab);
    if (abs(den) < 1e-4) continue;
    float t = cross2(a - S, ab) / den;     // along S→P
    float u = cross2(a - S, sp) / den;     // along the segment
    if (t <= 0.002 || t >= 1. || u < 0. || u > 1.) continue;
    float w = 1.;
    if (SOFT[i].x > 0.5) w *= smoothstep(0., 0.12, u);
    if (SOFT[i].y > 0.5) w *= smoothstep(1., 0.88, u);
    blocked = max(blocked, w);
  }
  return vec2(1. - blocked, dS);
}

// ---- directivity: the two J-hangs aim down-left (left seating / balconies) and down-right
// (right seating), a little fill straight down onto the stage, almost nothing at the ceiling ----
float smax(float a, float b, float k){ float h = clamp(.5 + .5*(a - b)/k, 0., 1.); return mix(b, a, h) + k*h*(1. - h); }
float lobe(vec2 dir, vec2 axis, float half_){ return smoothstep(cos(half_), cos(half_*0.3), dot(dir, axis)); }
float coverage(vec2 dir){
  float l = lobe(dir, normalize(vec2(-0.826, 0.563)), 0.78);
  float r = lobe(dir, normalize(vec2( 0.767, 0.642)), 0.78);
  float c = lobe(dir, vec2(0., 1.), 0.80) * 0.62;          // the hangs' coverage overlaps into one fan
  // smooth max: a hard max() leaves a crease where lobes meet, which the glass shading draws as a line
  return smax(smax(l, r, 0.3), c, 0.3);
}

void main(){
  vec2 ip0 = toImg(gl_FragCoord.xy);
  float aa = uPx * 1.2;

  vec2  halfView = 0.5 * uRes * uPx;
  float rMax = length(abs(uCenter - uFocus) + halfView) * 1.25;
  vec2  vis = sight(uFocus, ip0);          // x: line of sight from the rig, y: distance to nearest surface
  vec2  refr = vec2(0.);
  float light = 0., shade = 0.;
  for (int i = 0; i < ${MAXW}; i++){
    if (uAge[i] < 0.) continue;
    float f = uAge[i] / DUR;
    if (f >= 1.) continue;
    float R = uStill > 0.5 ? rMax*0.32 : mix(40., rMax, pow(f, 0.8));
    vec2  d = ip0 - uFocus;
    float r = length(d);
    vec2  dir = d / max(r, 1e-3);
    float cov = coverage(dir);
    // the front travels further where the boxes point: a directional, lobed front, not a circle
    float speed = 0.28 + 0.72*cov;
    float front = r - R*speed;                         // < 0 behind the front (~px)
    // flatten against surfaces: inside the wave, the edge is whichever is nearer — the free front
    // or the surface it has reached
    float sd = max(front, -vis.y);                     // < 0 inside the travelling wave
    float onWall = smoothstep(-6., 6., -vis.y - front); // 1 where a surface, not the free front, is the edge
    float env = uStill > 0.5 ? smoothstep(0., 0.25, f) * (1. - smoothstep(0.5, 1., f))
                             : smoothstep(0., 0.10, f) * (1. - smoothstep(0.40, 1., f));
    float gain = (0.06 + 0.94*cov) * env * vis.x;      // nothing beyond a surface: it was absorbed
    // struck surface: bright the moment the front arrives, then fading as it's absorbed
    gain *= mix(1., 1.15 * exp(front / (55. + R*0.06)), onWall);
    // Rim profile measured from the reference clip (same as the driver page): a faint soft step
    // at the edge, a broad glow peaking just *inside* it, a faint second surface, a milky veil.
    // dIn is the distance inside the wave, so the profile also follows the flattened wall edges.
    float depth = max(R*speed, 1.);
    float dIn   = -sd;
    float edge  = smoothstep(-2.*aa - 1.5, 2.*aa + 1.5, dIn);
    float bandW = 5. + depth*0.011;
    float band  = exp(-pow((dIn - (4. + depth*0.018)) / bandW, 2.));
    float veil  = edge * smoothstep(0., depth*0.06, dIn) * exp(-dIn / (depth*0.30));
    float inner = exp(-pow((dIn - depth*0.062) / (3. + depth*0.006), 2.)) * edge * (1. - onWall);
    float key   = 0.85 + 0.30*max(dot(dir, normalize(vec2(-0.6, -0.8))), 0.);
    // gentle uneven sheen along the arc (whole-number frequencies: no seam where atan wraps)
    float ang   = atan(dir.y, dir.x);
    float sheen = 0.82 + 0.18*sin(ang*3. + float(i)*2.1) * sin(ang*2. - float(i));
    light += (edge*0.30 + band*1.05 + veil*0.16 + inner*0.22) * gain * key * sheen;
    shade += edge * (1. - smoothstep(0., 6. + depth*0.01, dIn)) * gain;     // whisper of a dark outer lip
    refr  -= dir * (band*0.7 + veil*0.3) * gain * 6.;
    // the struck surface itself lights up along its edge as the front lands, then fades (absorbed)
    float strike = exp(-pow(vis.y / (2.5 + aa*1.5), 2.)) * step(front, 0.) * exp(front / (70. + R*0.08));
    light += strike * 1.3 * (0.06 + 0.94*cov) * env * vis.x;
  }
  vec2 ip = ip0 + refr;

  // full photo, untouched — only the waves are added
  vec3 col = tap(ip, 0.);

  // glass edge: faint dark inner edge + white rim, so it reads on bright wood
  // screen blend: milky glass over the photo, like the reference, never blown out
  col *= 1. - 0.06*shade*uBoost;
  col = 1. - (1. - col) * (1. - clamp(light * 0.55 * uBoost, 0., 1.) * vec3(0.95, 0.96, 1.0));

  // vignette in screen space
  vec2 q = gl_FragCoord.xy / uRes - 0.5;
  col *= 1. - 0.18*smoothstep(0.45, 0.85, length(q*vec2(1., 0.8)));   // very light vignette
  gl_FragColor = vec4(col, 1.);
}
`;

const canvas = document.getElementById('gl');
const stage  = document.getElementById('stage');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias:false, alpha:false, powerPreference:'high-performance' });
} catch (e) {
  document.getElementById('fallback').style.display = 'block';
  throw e;
}
renderer.setClearColor(0x000000, 1);

const scene  = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const uniforms = {
  uImg: { value: null }, uImgSize: { value: new THREE.Vector2(IMG.w, IMG.h) },
  uRes: { value: new THREE.Vector2(1, 1) }, uCenter: { value: new THREE.Vector2(FOCUS.x, FOCUS.y) },
  uFocus: { value: new THREE.Vector2(FOCUS.x, FOCUS.y) }, uPx: { value: 1 },
  uAge: { value: new Array(MAXW).fill(-1) }, uStill: { value: 0 },
  uBoost: { value: parseFloat(new URLSearchParams(location.search).get('boost')) || 1 },
};
const mat = new THREE.ShaderMaterial({
  uniforms, depthTest:false, depthWrite:false,
  vertexShader: 'void main(){ gl_Position = vec4(position.xy, 0., 1.); }',
  fragmentShader: frag,
});
scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat));

// ---- framing: cover the viewport, centred on the product (works for portrait too) ----
function frame(){
  const W = uniforms.uRes.value.x, H = uniforms.uRes.value.y;
  const s = Math.max(W / IMG.w, H / IMG.h) * ZOOM;      // device px per image px
  const vw = W / s, vh = H / s;
  // put the array a little above centre, but never show past the photo's edges
  const cx = Math.min(Math.max(FOCUS.x, vw/2), IMG.w - vw/2);
  const cy = Math.min(Math.max(FOCUS.y + vh*0.10, vh/2), IMG.h - vh/2);   // centred on the photo when it all fits
  uniforms.uPx.value = 1 / s;
  uniforms.uCenter.value.set(cx, cy);
}

let dprCap = 2;
function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, dprCap);
  renderer.setPixelRatio(dpr);
  renderer.setSize(stage.clientWidth, stage.clientHeight, false);
  renderer.getDrawingBufferSize(uniforms.uRes.value);
  frame();
  if (!running) render();
}

// ---- waves on demand: one per click / tap / Enter ----
const reduceMQ = matchMedia('(prefers-reduced-motion: reduce)');
const PREVIEW = parseFloat(new URLSearchParams(location.search).get('t'));   // ?t=1.2 → still of one wave at that age
let waves = [];                 // send times on our own clock (seconds)
let clock = 0, running = false, raf = 0, last = 0, ready = false;

function render(){ if (ready) renderer.render(scene, camera); }
function pushAges(){
  const ages = uniforms.uAge.value;
  for (let i = 0; i < MAXW; i++) ages[i] = i < waves.length ? clock - waves[i] : -1;
  uniforms.uStill.value = reduceMQ.matches ? 1 : 0;
}

function tick(now){
  const dt = last ? Math.min((now - last)/1000, 0.1) : 0;
  last = now;
  clock += dt;
  waves = waves.filter(t0 => clock - t0 < DUR);
  pushAges();
  render();
  if (waves.length && !document.hidden) raf = requestAnimationFrame(tick);
  else running = false;                       // idle: nothing animates until the next click
}
function start(){
  if (running || !ready) return;
  running = true; last = 0; raf = requestAnimationFrame(tick);
}
function sendWave(){
  if (!ready) return;
  if (waves.length >= MAXW) waves.shift();
  waves.push(clock);
  document.getElementById('hint').classList.add('gone');
  start();
}

stage.addEventListener('click', (e) => { if (!e.target.closest('a')) sendWave(); });
stage.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); sendWave(); }
});
if (matchMedia('(pointer: coarse)').matches) document.getElementById('hint').textContent = 'Tap to send a wave';
// pause mid-wave in a background tab, carry on where it left off when back
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { cancelAnimationFrame(raf); running = false; } else if (waves.length) start();
});

new THREE.TextureLoader().load('hall-auditorium.webp', (tex) => {
  tex.flipY = false;
  tex.generateMipmaps = true;
  tex.minFilter = THREE.LinearMipmapLinearFilter;
  tex.magFilter = THREE.LinearFilter;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  uniforms.uImg.value = tex;
  ready = true;
  resize();
  if (!isNaN(PREVIEW)) { waves = [0]; clock = PREVIEW; pushAges(); render(); document.getElementById('hint').classList.add('gone'); }
}, undefined, () => { document.getElementById('fallback').style.display = 'block'; });

new ResizeObserver(resize).observe(stage);
</script>
</body>
</html>
