<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Driver Build-up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root { --bg:#000; --accent:#ab9981; --logo:#816D4D; }
  html,body { margin:0; height:100%; background:var(--bg); }
  body { display:flex; align-items:center; justify-content:center; overflow:hidden;
         font-family:'Outfit',system-ui,sans-serif; color:var(--accent); }
  .stage { position:fixed; inset:0; width:100vw; height:100vh; height:100dvh; background:#000; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  /* build-up intro: the render, waves and UI stay hidden until the vector drawing resolves */
  #build { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; }
  .is-building #gl { opacity:0; filter:blur(16px); transform:scale(1.045); }
  #gl { transition: opacity .9s cubic-bezier(0.64,0.05,0,1), filter 1.1s cubic-bezier(0.64,0.05,0,1), transform 1.2s cubic-bezier(0.64,0.05,0,1); }
  .ui-hidden .caption, .ui-hidden .sound, .ui-hidden .back { opacity:0; transform:translateY(8px); }
  .caption, .sound, .back { transition: opacity .8s ease, transform .9s cubic-bezier(0.64,0.05,0,1); }
  .back { transition-delay:.06s; } .sound { transition-delay:.12s; }
  .caption { position:absolute; left:0; right:0; bottom:4.5%; text-align:center;
             font-weight:300; font-size:clamp(10px,1.05vw,14px); letter-spacing:.32em;
             text-transform:uppercase; opacity:.7; pointer-events:none; }
  .fallback { position:absolute; inset:0; display:none; align-items:center; justify-content:center; }
  .back { position:absolute; top:clamp(14px,3vh,28px); left:clamp(14px,2.5vw,32px); z-index:5;
          display:inline-flex; align-items:center; gap:.7em; padding:.6em 1.1em .6em 1em; border-radius:999px;
          border:1px solid rgba(171,153,129,.35); background:rgba(0,0,0,.35); color:#ab9981; text-decoration:none;
          font:300 clamp(10px,.85vw,12px)/1 'Outfit',system-ui,sans-serif; letter-spacing:.28em; text-transform:uppercase;
          -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); transition:border-color .2s ease, color .2s ease; }
  .back:hover { border-color:rgba(171,153,129,.8); color:#d8c7ad; }
  .back:focus-visible { outline:1px solid #ab9981; outline-offset:3px; }
  .sound { position:absolute; top:clamp(14px,3vh,28px); right:clamp(14px,2.5vw,32px);
           display:flex; align-items:center; gap:.7em; padding:.6em 1em; border:1px solid rgba(171,153,129,.35);
           border-radius:999px; background:rgba(0,0,0,.35); color:var(--accent); cursor:pointer;
           font:300 clamp(10px,.85vw,12px)/1 'Outfit',system-ui,sans-serif; letter-spacing:.28em; text-transform:uppercase;
           transition:border-color .2s ease, color .2s ease; -webkit-tap-highlight-color:transparent; }
  .sound:hover { border-color:rgba(171,153,129,.8); color:#d8c7ad; }
  .sound:focus-visible { outline:1px solid var(--accent); outline-offset:3px; }
  .sound .bars { display:flex; align-items:flex-end; gap:2px; height:10px; }
  .sound .bars i { width:2px; height:3px; background:currentColor; transition:height .3s ease; }
  .sound[aria-pressed="true"] .bars i { animation:eq 1.1s ease-in-out infinite; }
  .sound[aria-pressed="true"] .bars i:nth-child(2){ animation-delay:-.35s } .sound[aria-pressed="true"] .bars i:nth-child(3){ animation-delay:-.7s }
  @keyframes eq { 0%,100%{height:3px} 50%{height:10px} }
  @media (prefers-reduced-motion: reduce){ .sound[aria-pressed="true"] .bars i { animation:none; height:7px; } }
</style>
</head>
<body>
<div class="stage is-building ui-hidden" id="stage">
  <a class="back" href="./"><span aria-hidden="true">&larr;</span>Studies</a>
  <canvas id="gl" aria-label="Adamson compression driver face with radiating sound waves" role="img"></canvas>
  <div class="caption">Compression Driver</div>
  <svg id="build" aria-hidden="true">
    <defs><clipPath id="sweep"><path id="sweep-wedge" d="" /></clipPath></defs>
    <g id="guides"></g>
    <g id="shape">
      <path id="fill" fill-rule="evenodd" clip-path="url(#sweep)" />
      <g id="lines"></g>
    </g>
    <g id="handles"></g>
  </svg>
  <div class="fallback" id="fallback">WebGL is not available in this browser.</div>
  <button class="sound" id="sound" type="button" aria-pressed="false"><span class="bars" aria-hidden="true"><i></i><i></i><i></i></span><span class="label">Sound off</span></button>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const LOOP = 3.4; // seconds — matches the reference clip, loops seamlessly

const frag = /* glsl */`
precision highp float;
uniform vec2  uRes;
uniform float uTime;
uniform mat3  uRot;     // face local → world (columns: face x, face y, face normal)
uniform vec2  uAxis[2]; // each wave's direction, frozen at the moment it left the dome
#define PI 3.14159265
#define LOOP ${LOOP.toFixed(3)}

// ---------- utils ----------
float hash(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p,p+45.32); return fract(p.x*p.y); }
float noise(vec2 p){
  vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+1.),f.x), f.y);
}
float seg(vec2 p, vec2 a, vec2 b){ vec2 pa=p-a, ba=b-a; float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.); return length(pa-ba*h); }
float sdRoundBox(vec2 p, vec2 b, float r){ vec2 q=abs(p)-b+r; return length(max(q,0.))+min(max(q.x,q.y),0.)-r; }
float smin(float a, float b, float k){ float h=clamp(.5+.5*(b-a)/k,0.,1.); return mix(b,a,h)-k*h*(1.-h); }

// Rounded, chamfered octagon (h = half extents, c = chamfer |x|+|y|<=c, r = corner radius)
float sdOct(vec2 p, vec2 h, float c, float r){
  vec2 q = abs(p);
  h -= r; c -= r*1.41421356;
  float inside = max(max(q.x-h.x, q.y-h.y), (q.x+q.y-c)*0.70710678);
  float d = inside;
  if(inside > 0.){
    vec2 A = vec2(c-h.y, h.y), B = vec2(h.x, c-h.x);
    d = min(min(seg(q, vec2(0.,h.y), A), seg(q, A, B)), seg(q, B, vec2(h.x,0.)));
  }
  return d - r;
}

// ---------- housing ----------
// Reference units: the face is drawn in 1080-tall "image pixels", centre at 0.
const float DOME_R = 201.;
const vec2  BOLT   = vec2(147.,175.);
const float DOME_H = 84.;     // how far the dome bulges out of the face
const float CAM    = 3000.;   // camera distance, reference units (gentle perspective)

float housingSD(vec2 p){
  float o = sdOct(p, vec2(242.,247.), 357., 16.);
  float t = sdRoundBox(vec2(abs(p.x)-250., p.y), vec2(14.,51.), 5.);
  return smin(o, t, 5.);
}

// height field of the metal (0 = deep, 1 = front face)
float housingH(vec2 p){
  float d = housingSD(p);
  float e = clamp(-d/11., 0., 1.);
  float h = sqrt(1. - (1.-e)*(1.-e));                 // rounded outer bevel
  // tab step: the tabs sit a little lower than the face
  float tabZone = smoothstep(236., 240., abs(p.x)) * step(abs(p.y), 60.);
  h *= 1. - 0.18*tabZone;
  // stepped inner lip
  float r = length(p);
  float lip = 0.62 + 0.38*sqrt(clamp((r-214.)/4., 0., 1.));
  lip *= smoothstep(200.5, 202.5, r);
  h = min(h, lip);
  // a fine machined groove on the lip ledge
  h -= 0.04*exp(-pow((r-208.)/0.9, 2.));
  // bolt holes (countersunk)
  float bd = length(abs(p) - BOLT);
  h -= 0.28*(1.-smoothstep(8.5, 12.5, bd));
  h -= 0.55*(1.-smoothstep(5.5, 7.5, bd));
  return h;
}

vec3 shadeHousing(vec2 p, float aa){
  float h  = housingH(p);
  float hx = housingH(p+vec2(1.,0.));
  float hy = housingH(p+vec2(0.,1.));
  vec3 n = normalize(vec3(-(hx-h)*7., -(hy-h)*7., 1.));
  // anodised bronze with slight mottling + fine grain
  vec3 base = vec3(0.49,0.36,0.23);
  float mott = noise(p*0.012)*0.5 + noise(p*0.035)*0.5;
  float grain = noise(p*0.9 + 13.)*0.6 + noise(p*2.3)*0.4;
  base *= 0.9 + 0.14*mott + 0.06*(grain-0.5);
  // soft studio light from top-left, plus a broad fill
  vec3 L = normalize(transpose(uRot) * vec3(-0.38, 0.55, 0.74));
  vec3 V = transpose(uRot) * vec3(0.,0.,1.);
  float diff = max(dot(n,L), 0.);
  float spec = pow(max(dot(reflect(-L,n),V),0.), 18.);
  float rim  = 1. - n.z;
  vec3 col = base*(0.28 + 0.78*diff);
  col += vec3(1.,0.84,0.62)*spec*0.30;
  // bright machined edge catching the key light, darker on the shadow side
  float lit = dot(n.xy, normalize(vec2(-0.55,0.7)));
  col += vec3(0.95,0.78,0.55)*rim*1.1*smoothstep(-0.1,0.8,lit);
  col *= 1. - 0.45*rim*smoothstep(0.1,-0.8,lit);
  // diagonal falloff: brighter upper-left, deeper lower-right
  col *= 0.88 + 0.16*clamp(dot(p, normalize(vec2(-0.6,0.8)))/260., -1., 1.);
  // dark inside holes + dome gap
  float bd = length(abs(p) - BOLT);
  col *= mix(0.08, 1., smoothstep(4.5, 7., bd));
  float r = length(p);
  col *= mix(0.15, 1., smoothstep(201., 203.5, r));
  col *= 1. - 0.45*exp(-pow((r-217.5)/1.6, 2.));    // shadow line where the lip meets the face
  return col;
}

// ---------- woven gold dome ----------
vec3 weave(vec2 u, float pitch){
  // soft plain-weave fabric: every crossing is a small rounded yarn "pillow"
  // (elongated along the yarn) that the light rolls over. returns (height, normal.xy)
  u += vec2(noise(u*0.045), noise(u*0.045 + 17.)) * pitch * 0.45;   // yarns aren't ruler-straight
  vec2 g = u/pitch;
  vec2 i = floor(g);
  vec2 f = fract(g) - 0.5;
  float chk = mod(i.x + i.y, 2.);
  float across = chk < .5 ? f.x : f.y;
  float along  = chk < .5 ? f.y : f.x;
  float lane   = chk < .5 ? i.x : i.y;
  float run    = chk < .5 ? g.y : g.x;
  float wid = 0.50 + 0.06*(hash(vec2(lane, 3.7)) - 0.5);
  float len = 0.66;
  vec2 e = vec2(across/wid, along/len);
  float d2 = dot(e, e);
  float hgt = sqrt(max(0., 1. - d2));
  hgt = mix(hgt, 1., 0.15);                       // yarns pack tight, gaps stay shallow
  // filaments + per-crossing variation
  hgt *= 0.92 + 0.08*noise(vec2(run*6., lane*3.1 + across*8.));
  hgt *= 0.92 + 0.16*hash(i);
  vec2 nrm = e * 0.85 * smoothstep(1.25, 0.6, d2);   // outward-facing, rolls off at the edge
  nrm = chk < .5 ? nrm : nrm.yx;
  return vec3(hgt, nrm);
}

vec3 shadeDome(vec2 p, float pulse){
  vec2 q = p/DOME_R;
  float rr = length(q);
  float z = sqrt(max(0., 1. - rr*rr));
  vec3 n = normalize(vec3(q*0.9, z));
  // concentric breathing ripple — integer cycles per loop so it is seamless
  float rip = sin(2.*PI*(rr*3.2 - 2.*uTime/LOOP));
  n = normalize(n + vec3(q/max(rr,1e-3), 0.)*rip*0.035*smoothstep(1.,.7,rr));

  // weave mapped over the sphere so threads compress toward the rim
  float arc = asin(min(rr, 0.999));
  vec2 uv = (rr > 1e-4 ? q/rr : q) * arc * DOME_R;
  float a = radians(38.);
  uv = mat2(cos(a),-sin(a),sin(a),cos(a)) * uv;
  vec3 w = weave(uv, 6.4);
  vec2 fw = fwidth(uv/6.4);
  float amt = 1. - smoothstep(0.3, 0.75, max(fw.x, fw.y));
  vec2 wn = mat2(cos(a),sin(a),-sin(a),cos(a)) * w.yz;
  vec3 nw = normalize(n + vec3(wn*0.75*amt, 0.));

  vec3 L  = normalize(transpose(uRot) * vec3(-0.32, 0.42, 0.85));
  float dS = max(dot(n,  L), 0.);
  float dW = max(dot(nw, L), 0.);
  vec3 deep = vec3(0.46,0.28,0.05);
  vec3 mid  = vec3(0.94,0.68,0.20);
  vec3 hi   = vec3(1.00,0.90,0.60);
  vec3 col = mix(deep, mid, smoothstep(0.05, 0.75, dS));
  col *= mix(1., 0.55 + 0.50*w.x, amt);
  col *= mix(1., 0.45 + 0.75*dW/max(dS, 0.25), amt) * mix(0.78 + 0.30*dS, 1., amt);
  // broad, soft satin sheen rather than a hard specular
  float sheen = pow(max(dot(reflect(-L,nw), transpose(uRot) * vec3(0,0,1)), 0.), 4.);
  col += hi*sheen*0.16*(0.6+0.4*w.x);
  // tiny fuzz so it reads as cloth, not metal mesh
  col *= 0.97 + 0.06*noise(uv*1.7);
  // gentle tonal unevenness across the cloth
  col *= 0.96 + 0.08*noise(uv*0.012 + 5.);
  // stitched seam band near the rim
  float seam = exp(-pow((rr-0.865)/0.012, 2.));
  col *= 1. - 0.12*seam;
  col += hi*0.08*smoothstep(0.86, 0.88, rr)*(1.-smoothstep(0.95,0.99,rr));
  // rim darkening + occlusion under the lip
  col *= mix(0.55, 1., smoothstep(1.0, 0.78, rr));
  col *= mix(0.35, 1., smoothstep(1.0, 0.975, rr));
  // light lift when a wave is emitted
  col *= 1. + 0.12*pulse*(1.-rr*0.6);
  return col;
}

vec3 face(vec2 p, vec2 pd, float hitDome, float aa, float pulse){
  float d = housingSD(p);
  float cover = 1. - smoothstep(-aa, aa, d);
  vec3 col = vec3(0.);
  if(cover > 0.){
    vec3 metal = shadeHousing(p, aa);
    if(hitDome > 0.){
      vec3 dome = shadeDome(pd, pulse);
      metal = mix(dome, metal, smoothstep(DOME_R-aa, DOME_R+aa, length(pd)));
    }
    col = metal*cover;
  }
  // faint contact glow so the bronze edge reads against black
  col += vec3(0.03,0.02,0.012)*exp(-max(d,0.)/6.)*(1.-cover);
  return col;
}

void main(){
  // fit the face to the shorter side (portrait screens use width) — fills the whole viewport
  float k  = 1080. / min(uRes.y, uRes.x*1.1);    // reference px per device px
  vec2  p  = (gl_FragCoord.xy - 0.5*uRes) * k;
  p.y -= 22.;                                   // match product-shot centring
  float aa = k * 0.9;
  float t  = uTime / LOOP;

  // ---- sound-wave shells (glassy spheres, rim-lit) ----
  const int N = 2;
  vec2  refr = vec2(0.);
  float light = 0.;
  float pulse = 0.;
  for(int i=0; i<N; i++){
    float f = fract(t + float(i)/float(N));
    // a wave keeps the direction the face pointed when it was emitted: turning the face
    // afterwards only changes the next wave, like real sound already in the air
    vec2  axis = uAxis[i];
    float axisL = length(axis);
    vec2  axisN = axisL > 1e-4 ? axis / axisL : vec2(0.);
    float R = mix(196., max(1320., length(0.5*uRes)*k*1.05) * (1. + axisL), pow(f, 0.82));  // always clears the corners
    vec2  cen = axis * R * 0.62;                             // a sphere travelling along the axis
    vec2  dv  = p - cen;
    float r   = length(dv);
    vec2  dir = r > 1e-3 ? dv/r : vec2(0.);
    float ang = atan(dir.y, dir.x);
    float env = smoothstep(0., 0.10, f) * (1. - smoothstep(0.45, 1., f));
    pulse += smoothstep(0., 0.06, f) * (1. - smoothstep(0.06, 0.32, f));
    // Rim profile measured from the reference clip (thick glass seen edge-on):
    // a faint soft step at the outer edge, a broad glow peaking ~2.5% of R *inside* the edge,
    // then a milky veil that fades slowly toward the centre. No hard line anywhere.
    float dIn   = R - r;                                     // > 0 inside the shell
    float edge  = smoothstep(-2.*aa - 1.5, 2.*aa + 1.5, dIn);
    float bandW = 5. + R*0.011;
    float band  = exp(-pow((dIn - (4. + R*0.018)) / bandW, 2.));
    float veil  = edge * smoothstep(0., R*0.06, dIn) * exp(-dIn / (R*0.30));
    float inner = exp(-pow((dIn - R*0.062) / (3. + R*0.006), 2.)) * edge;    // faint second surface
    // like the reference: strongest on the flanks, fading over the top and bottom,
    // with a gentle uneven sheen along the arc
    // flank/key shading is measured from the face, so the shell's moving centre leaves no dark band
    vec2  dirF  = length(p) > 1e-3 ? normalize(p) : dir;
    float flank = 0.15 + 0.85*pow(abs(dirF.x), 1.6);
    float key   = 0.80 + 0.40*max(dot(dirF, normalize(vec2(-0.6, 0.8))), 0.);
    // whole-number frequencies only: atan() wraps at ±PI (left horizontal), so anything else leaves a seam there
    float sheen = 0.80 + 0.20*sin(ang*3. + float(i)*2.1) * sin(ang*2. - float(i));
    float aim = 1. + 1.6*axisL*dot(dir, axisN);            // brighter on the side the face points to
    float s = (edge*0.30 + band*1.05 + veil*0.16 + inner*0.22) * flank * key * sheen * env * aim;
    light += s;
    refr  -= dir * band * env * flank * 6.;                    // bend only at the rim (centre can sit beside the face)
  }

  // ---- tilt: a ray from a camera in front hits the turned face (plane) or its dome (ellipsoid) ----
  vec2 ps = p + refr;
  mat3 toL = transpose(uRot);
  vec3 ro = vec3(0., 0., CAM);
  vec3 rd = normalize(vec3(ps, 0.) - ro);
  vec3 nz = uRot[2];
  vec2 pp = (toL * (ro + rd * (-dot(nz, ro) / dot(nz, rd)))).xy;
  vec3 oL = (toL * ro) / vec3(DOME_R, DOME_R, DOME_H);
  vec3 dL = (toL * rd) / vec3(DOME_R, DOME_R, DOME_H);
  float qa = dot(dL, dL), qb = dot(oL, dL), qc = dot(oL, oL) - 1.;
  float disc = qb*qb - qa*qc;
  vec2 pd = pp; float hitDome = 0.;
  if (disc > 0.) {
    vec3 h = (oL + dL * ((-qb - sqrt(disc)) / qa)) * vec3(DOME_R, DOME_R, DOME_H);
    if (h.z >= 0.) { pd = h.xy; hitDome = 1.; }
  }
  vec3 col = face(pp, pd, hitDome, aa, pulse);
  // screen blend: soft milky glass on the bronze/gold, never blows out
  col = 1. - (1. - col) * (1. - clamp(light * 0.26, 0., 1.) * vec3(0.95, 0.96, 1.0));
  // keep the darks pure black, very soft vignette
  col *= 1. - 0.18*smoothstep(500., 1150., length(p*vec2(0.8,1.)));
  col = pow(col, vec3(0.97));
  gl_FragColor = vec4(col, 1.);
}
`;

const canvas = document.getElementById('gl');
const stage  = document.getElementById('stage');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias:false, alpha:false, powerPreference:'high-performance' });
} catch (e) {
  document.getElementById('fallback').style.display = 'flex';
  throw e;
}
renderer.setClearColor(0x000000, 1);

const scene  = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const uniforms = { uRes:{ value:new THREE.Vector2(1,1) }, uTime:{ value:0 }, uRot:{ value:new THREE.Matrix3() },
                   uAxis:{ value:[new THREE.Vector2(), new THREE.Vector2()] } };
const mat = new THREE.ShaderMaterial({
  uniforms,
  vertexShader: 'void main(){ gl_Position = vec4(position.xy, 0., 1.); }',
  fragmentShader: frag,
  depthTest:false, depthWrite:false,
});
// fwidth needs derivatives in WebGL1; three uses WebGL2 where it is core.
scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat));

// ---------------------------------------------------------------------------
// Chladni sand — background particles (same technique as curation-by.com):
// tens of thousands of points pulled toward the nodal lines of a vibrating
// plate, L(x,y) = a·sin(πnx)·sin(πmy) + b·sin(πmx)·sin(πny). Each step a
// particle moves down the gradient of L², jitters more where the plate moves
// (|L| large) and settles where it is still (L = 0). n, m, a, b drift slowly so
// the figure keeps morphing. Here the driver's wave shells also shake the sand.
// ---------------------------------------------------------------------------
const SAND = {
  count: matchMedia('(pointer: coarse)').matches ? 22000 : 45000,
  color: [138/255, 110/255, 75/255],   // #8A6E4B bronze
  alpha: 1.0,
  size: 1.5,                  // CSS px
  spread: 5,                  // CSS px — max offset of each grain from its line (band ≈ 2×spread wide)
};
const sPos = new Float32Array(SAND.count * 2);
const sVel = new Float32Array(SAND.count * 2);
const sAlp = new Float32Array(SAND.count);
const sBase = new Float32Array(SAND.count);
const sOff = new Float32Array(SAND.count * 2);   // fixed per-grain scatter, CSS px
let rngState = 0x9e3779b9;
const rnd = () => { rngState ^= rngState << 13; rngState ^= rngState >>> 17; rngState ^= rngState << 5; return (rngState >>> 0) / 4294967296; };
for (let i = 0; i < SAND.count; i++) {
  sPos[i*2] = rnd()*2 - 1; sPos[i*2+1] = rnd()*2 - 1;
  sBase[i] = 0.25 + rnd()*0.75;
  // gaussian-ish scatter (σ ≈ spread/2, clipped at spread) so lines read as soft sandy bands
  const ang = rnd()*Math.PI*2, rad = Math.min(Math.sqrt(-2*Math.log(1 - rnd()*0.9999)) * SAND.spread*0.5, SAND.spread);
  sOff[i*2] = Math.cos(ang)*rad; sOff[i*2+1] = Math.sin(ang)*rad;
}
const sandGeo = new THREE.BufferGeometry();
const sandPosAttr = new THREE.BufferAttribute(sPos, 2).setUsage(THREE.DynamicDrawUsage);
const sandAlpAttr = new THREE.BufferAttribute(sAlp, 1).setUsage(THREE.DynamicDrawUsage);
sandGeo.setAttribute('position', sandPosAttr);
sandGeo.setAttribute('aAlpha', sandAlpAttr);

  [[0,-201,1,0],[201,0,0,1],[0,201,1,0],[-201,0,0,1]].forEach(([x,y,hx,hy]) => addAnchor(x, y, hx, hy, 201*K));
  [[0,-217,1,0],[0,217,1,0]].forEach(([x,y,hx,hy]) => addAnchor(x, y, hx, hy, 217*K*0.55));
  const hNodes = anchors.map(a => {
    const g = el('g', {}, handles);
    const ln = a.hl ? el('line', { stroke: C.gold, 'stroke-width': 1, 'vector-effect': 'non-scaling-stroke' }, g) : null;
    const ends = a.hl ? [el('circle', { r: 2.2, fill: C.gold }, g), el('circle', { r: 2.2, fill: C.gold }, g)] : [];
    const sq = el('rect', { width: 6, height: 6, fill: '#000', stroke: C.gold, 'stroke-width': 1.2, 'vector-effect': 'non-scaling-stroke' }, g);
    return { g, ln, ends, sq };
  });

  // map reference units onto the screen exactly like the shader does
  let s = 1;
  function layout() {
    const W = stage.clientWidth, H = stage.clientHeight;
    s = Math.min(H, W * 1.1) / 1080;
    const cx = W / 2, cy = H / 2 - 22 * s;
    svg.setAttribute('viewBox', `${-cx / s} ${-cy / s} ${W / s} ${H / s}`);
  }
  addEventListener('resize', layout); layout();

  function frame(t) {      // t in ms
    // 1 guides + 2 expand (housing leads, inner parts follow)
    G.forEach((g, i) => g.style.opacity = smooth(seg(t, i*40, 380 + i*40)) * (1 - smooth(seg(t, 2900, 3500))));
    const grow = E(seg(t, 120, 1050));
    const sc = 0.07 + 0.93 * grow;
    shape.setAttribute('transform', `scale(${sc})`);
    parts.forEach(p => {
      const v = seg(t, 120 + p.t0*900, 700 + p.t0*900);
      p.node.style.opacity = smooth(v) * (1 - smooth(seg(t, 2800, 3400)));
    });
    // 3 progress sweep, clockwise from 12 o'clock
    const prog = smooth(seg(t, 1050, 2350));
    const ang = prog * Math.PI * 2, R = 400;
    wedge.setAttribute('d', prog >= 1 ? `M-${R},-${R}h${2*R}v${2*R}h-${2*R}z`
      : `M0,0L0,${-R}A${R},${R} 0 ${ang > Math.PI ? 1 : 0},1 ${R*Math.sin(ang)},${-R*Math.cos(ang)}Z`);
    fill.style.opacity = 1 - smooth(seg(t, 2350, 2750));
    // anchors follow the scaled geometry but keep their screen size
    const ha = smooth(seg(t, 200, 650)) * (1 - smooth(seg(t, 2700, 3300)));
    anchors.forEach((a, i) => {
      const n = hNodes[i], x = a.x * sc, y = a.y * sc, k = 1 / s;
      n.g.style.opacity = ha;
      n.sq.setAttribute('x', x - 3*k); n.sq.setAttribute('y', y - 3*k);
      n.sq.setAttribute('width', 6*k); n.sq.setAttribute('height', 6*k);
      if (n.ln) {
        const l = a.hl * sc;
        const x1 = x - a.hx*l, y1 = y - a.hy*l, x2 = x + a.hx*l, y2 = y + a.hy*l;
        n.ln.setAttribute('x1', x1); n.ln.setAttribute('y1', y1); n.ln.setAttribute('x2', x2); n.ln.setAttribute('y2', y2);
        n.ends[0].setAttribute('cx', x1); n.ends[0].setAttribute('cy', y1); n.ends[0].setAttribute('r', 2.2*k);
        n.ends[1].setAttribute('cx', x2); n.ends[1].setAttribute('cy', y2); n.ends[1].setAttribute('r', 2.2*k);
      }
    });
    // 4 render resolves inside the outline, 5 UI arrives
    if (t >= 2380) stage.classList.remove('is-building');
    if (t >= 3150) stage.classList.remove('ui-hidden');
  }

  // ?build=1800 freezes the intro at that time (QA / stills)
  const FREEZE = parseFloat(new URLSearchParams(location.search).get('build'));
  if (reduce) { stage.classList.remove('is-building', 'ui-hidden'); svg.style.display = 'none'; return; }
  if (!isNaN(FREEZE)) { frame(FREEZE); return; }
  const t0 = performance.now(), END = 3600;
  const tick = (now) => { const t = now - t0; frame(Math.min(t, END)); if (t < END) requestAnimationFrame(tick); else svg.style.display = 'none'; };
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
