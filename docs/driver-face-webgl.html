<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Driver Face WebGL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root { --bg:#000; --accent:#ab9981; --logo:#816D4D; }
  html,body { margin:0; height:100%; background:var(--bg); }
  body { display:flex; align-items:center; justify-content:center; overflow:hidden;
         font-family:'Outfit',system-ui,sans-serif; color:var(--accent); }
  .stage { position:fixed; inset:0; width:100vw; height:100vh; height:100dvh; background:#000; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .caption { position:absolute; left:0; right:0; bottom:4.5%; text-align:center;
             font-weight:300; font-size:clamp(10px,1.05vw,14px); letter-spacing:.32em;
             text-transform:uppercase; opacity:.7; pointer-events:none; }
  .fallback { position:absolute; inset:0; display:none; align-items:center; justify-content:center; }
  .sound { position:absolute; top:clamp(14px,3vh,28px); right:clamp(14px,2.5vw,32px);
           display:flex; align-items:center; gap:.7em; padding:.6em 1em; border:1px solid rgba(171,153,129,.35);
           border-radius:999px; background:rgba(0,0,0,.35); color:var(--accent); cursor:pointer;
           font:300 clamp(10px,.85vw,12px)/1 'Outfit',system-ui,sans-serif; letter-spacing:.28em; text-transform:uppercase;
           transition:border-color .2s ease, color .2s ease; -webkit-tap-highlight-color:transparent; }
  .sound:hover { border-color:rgba(171,153,129,.8); color:#d8c7ad; }
  .sound:focus-visible { outline:1px solid var(--accent); outline-offset:3px; }
  .sound .bars { display:flex; align-items:flex-end; gap:2px; height:10px; }
  .sound .bars i { width:2px; height:3px; background:currentColor; transition:height .3s ease; }
  .sound[aria-pressed="true"] .bars i { animation:eq 1.1s ease-in-out infinite; }
  .sound[aria-pressed="true"] .bars i:nth-child(2){ animation-delay:-.35s } .sound[aria-pressed="true"] .bars i:nth-child(3){ animation-delay:-.7s }
  @keyframes eq { 0%,100%{height:3px} 50%{height:10px} }
  @media (prefers-reduced-motion: reduce){ .sound[aria-pressed="true"] .bars i { animation:none; height:7px; } }
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="gl" aria-label="Adamson compression driver face with radiating sound waves" role="img"></canvas>
  <div class="caption">Compression Driver</div>
  <div class="fallback" id="fallback">WebGL is not available in this browser.</div>
  <button class="sound" id="sound" type="button" aria-pressed="false"><span class="bars" aria-hidden="true"><i></i><i></i><i></i></span><span class="label">Sound off</span></button>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const LOOP = 3.4; // seconds — matches the reference clip, loops seamlessly

const frag = /* glsl */`
precision highp float;
uniform vec2  uRes;
uniform float uTime;
#define PI 3.14159265
#define LOOP ${LOOP.toFixed(3)}

// ---------- utils ----------
float hash(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p,p+45.32); return fract(p.x*p.y); }
float noise(vec2 p){
  vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+1.),f.x), f.y);
}
float seg(vec2 p, vec2 a, vec2 b){ vec2 pa=p-a, ba=b-a; float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.); return length(pa-ba*h); }
float sdRoundBox(vec2 p, vec2 b, float r){ vec2 q=abs(p)-b+r; return length(max(q,0.))+min(max(q.x,q.y),0.)-r; }
float smin(float a, float b, float k){ float h=clamp(.5+.5*(b-a)/k,0.,1.); return mix(b,a,h)-k*h*(1.-h); }

// Rounded, chamfered octagon (h = half extents, c = chamfer |x|+|y|<=c, r = corner radius)
float sdOct(vec2 p, vec2 h, float c, float r){
  vec2 q = abs(p);
  h -= r; c -= r*1.41421356;
  float inside = max(max(q.x-h.x, q.y-h.y), (q.x+q.y-c)*0.70710678);
  float d = inside;
  if(inside > 0.){
    vec2 A = vec2(c-h.y, h.y), B = vec2(h.x, c-h.x);
    d = min(min(seg(q, vec2(0.,h.y), A), seg(q, A, B)), seg(q, B, vec2(h.x,0.)));
  }
  return d - r;
}

// ---------- housing ----------
// Reference units: the face is drawn in 1080-tall "image pixels", centre at 0.
const float DOME_R = 201.;
const vec2  BOLT   = vec2(147.,175.);

float housingSD(vec2 p){
  float o = sdOct(p, vec2(242.,247.), 357., 16.);
  float t = sdRoundBox(vec2(abs(p.x)-250., p.y), vec2(14.,51.), 5.);
  return smin(o, t, 5.);
}

// height field of the metal (0 = deep, 1 = front face)
float housingH(vec2 p){
  float d = housingSD(p);
  float e = clamp(-d/11., 0., 1.);
  float h = sqrt(1. - (1.-e)*(1.-e));                 // rounded outer bevel
  // tab step: the tabs sit a little lower than the face
  float tabZone = smoothstep(236., 240., abs(p.x)) * step(abs(p.y), 60.);
  h *= 1. - 0.18*tabZone;
  // stepped inner lip
  float r = length(p);
  float lip = 0.62 + 0.38*sqrt(clamp((r-214.)/4., 0., 1.));
  lip *= smoothstep(200.5, 202.5, r);
  h = min(h, lip);
  // a fine machined groove on the lip ledge
  h -= 0.04*exp(-pow((r-208.)/0.9, 2.));
  // bolt holes (countersunk)
  float bd = length(abs(p) - BOLT);
  h -= 0.28*(1.-smoothstep(8.5, 12.5, bd));
  h -= 0.55*(1.-smoothstep(5.5, 7.5, bd));
  return h;
}

vec3 shadeHousing(vec2 p, float aa){
  float h  = housingH(p);
  float hx = housingH(p+vec2(1.,0.));
  float hy = housingH(p+vec2(0.,1.));
  vec3 n = normalize(vec3(-(hx-h)*7., -(hy-h)*7., 1.));
  // anodised bronze with slight mottling + fine grain
  vec3 base = vec3(0.49,0.36,0.23);
  float mott = noise(p*0.012)*0.5 + noise(p*0.035)*0.5;
  float grain = noise(p*0.9 + 13.)*0.6 + noise(p*2.3)*0.4;
  base *= 0.9 + 0.14*mott + 0.06*(grain-0.5);
  // soft studio light from top-left, plus a broad fill
  vec3 L = normalize(vec3(-0.38, 0.55, 0.74));
  vec3 V = vec3(0.,0.,1.);
  float diff = max(dot(n,L), 0.);
  float spec = pow(max(dot(reflect(-L,n),V),0.), 18.);
  float rim  = 1. - n.z;
  vec3 col = base*(0.28 + 0.78*diff);
  col += vec3(1.,0.84,0.62)*spec*0.30;
  // bright machined edge catching the key light, darker on the shadow side
  float lit = dot(n.xy, normalize(vec2(-0.55,0.7)));
  col += vec3(0.95,0.78,0.55)*rim*1.1*smoothstep(-0.1,0.8,lit);
  col *= 1. - 0.45*rim*smoothstep(0.1,-0.8,lit);
  // diagonal falloff: brighter upper-left, deeper lower-right
  col *= 0.88 + 0.16*clamp(dot(p, normalize(vec2(-0.6,0.8)))/260., -1., 1.);
  // dark inside holes + dome gap
  float bd = length(abs(p) - BOLT);
  col *= mix(0.08, 1., smoothstep(4.5, 7., bd));
  float r = length(p);
  col *= mix(0.15, 1., smoothstep(201., 203.5, r));
  col *= 1. - 0.45*exp(-pow((r-217.5)/1.6, 2.));    // shadow line where the lip meets the face
  return col;
}

// ---------- woven gold dome ----------
vec3 weave(vec2 u, float pitch){
  // soft plain-weave fabric: every crossing is a small rounded yarn "pillow"
  // (elongated along the yarn) that the light rolls over. returns (height, normal.xy)
  u += vec2(noise(u*0.045), noise(u*0.045 + 17.)) * pitch * 0.45;   // yarns aren't ruler-straight
  vec2 g = u/pitch;
  vec2 i = floor(g);
  vec2 f = fract(g) - 0.5;
  float chk = mod(i.x + i.y, 2.);
  float across = chk < .5 ? f.x : f.y;
  float along  = chk < .5 ? f.y : f.x;
  float lane   = chk < .5 ? i.x : i.y;
  float run    = chk < .5 ? g.y : g.x;
  float wid = 0.50 + 0.06*(hash(vec2(lane, 3.7)) - 0.5);
  float len = 0.66;
  vec2 e = vec2(across/wid, along/len);
  float d2 = dot(e, e);
  float hgt = sqrt(max(0., 1. - d2));
  hgt = mix(hgt, 1., 0.15);                       // yarns pack tight, gaps stay shallow
  // filaments + per-crossing variation
  hgt *= 0.92 + 0.08*noise(vec2(run*6., lane*3.1 + across*8.));
  hgt *= 0.92 + 0.16*hash(i);
  vec2 nrm = e * 0.85 * smoothstep(1.25, 0.6, d2);   // outward-facing, rolls off at the edge
  nrm = chk < .5 ? nrm : nrm.yx;
  return vec3(hgt, nrm);
}

vec3 shadeDome(vec2 p, float pulse){
  vec2 q = p/DOME_R;
  float rr = length(q);
  float z = sqrt(max(0., 1. - rr*rr));
  vec3 n = normalize(vec3(q*0.9, z));
  // concentric breathing ripple — integer cycles per loop so it is seamless
  float rip = sin(2.*PI*(rr*3.2 - 2.*uTime/LOOP));
  n = normalize(n + vec3(q/max(rr,1e-3), 0.)*rip*0.035*smoothstep(1.,.7,rr));

  // weave mapped over the sphere so threads compress toward the rim
  float arc = asin(min(rr, 0.999));
  vec2 uv = (rr > 1e-4 ? q/rr : q) * arc * DOME_R;
  float a = radians(38.);
  uv = mat2(cos(a),-sin(a),sin(a),cos(a)) * uv;
  vec3 w = weave(uv, 6.4);
  vec2 fw = fwidth(uv/6.4);
  float amt = 1. - smoothstep(0.3, 0.75, max(fw.x, fw.y));
  vec2 wn = mat2(cos(a),sin(a),-sin(a),cos(a)) * w.yz;
  vec3 nw = normalize(n + vec3(wn*0.75*amt, 0.));

  vec3 L  = normalize(vec3(-0.32, 0.42, 0.85));
  float dS = max(dot(n,  L), 0.);
  float dW = max(dot(nw, L), 0.);
  vec3 deep = vec3(0.46,0.28,0.05);
  vec3 mid  = vec3(0.94,0.68,0.20);
  vec3 hi   = vec3(1.00,0.90,0.60);
  vec3 col = mix(deep, mid, smoothstep(0.05, 0.75, dS));
  col *= mix(1., 0.55 + 0.50*w.x, amt);
  col *= mix(1., 0.45 + 0.75*dW/max(dS, 0.25), amt) * mix(0.78 + 0.30*dS, 1., amt);
  // broad, soft satin sheen rather than a hard specular
  float sheen = pow(max(dot(reflect(-L,nw), vec3(0,0,1)), 0.), 4.);
  col += hi*sheen*0.16*(0.6+0.4*w.x);
  // tiny fuzz so it reads as cloth, not metal mesh
  col *= 0.97 + 0.06*noise(uv*1.7);
  // gentle tonal unevenness across the cloth
  col *= 0.96 + 0.08*noise(uv*0.012 + 5.);
  // stitched seam band near the rim
  float seam = exp(-pow((rr-0.865)/0.012, 2.));
  col *= 1. - 0.12*seam;
  col += hi*0.08*smoothstep(0.86, 0.88, rr)*(1.-smoothstep(0.95,0.99,rr));
  // rim darkening + occlusion under the lip
  col *= mix(0.55, 1., smoothstep(1.0, 0.78, rr));
  col *= mix(0.35, 1., smoothstep(1.0, 0.975, rr));
  // light lift when a wave is emitted
  col *= 1. + 0.12*pulse*(1.-rr*0.6);
  return col;
}

vec3 face(vec2 p, float aa, float pulse){
  float d = housingSD(p);
  float cover = 1. - smoothstep(-aa, aa, d);
  vec3 col = vec3(0.);
  if(cover > 0.){
    float r = length(p);
    vec3 metal = shadeHousing(p, aa);
    if(r < DOME_R + 2.){
      vec3 dome = shadeDome(p, pulse);
      metal = mix(dome, metal, smoothstep(DOME_R-aa, DOME_R+aa, r));
    }
    col = metal*cover;
  }
  // faint contact glow so the bronze edge reads against black
  col += vec3(0.03,0.02,0.012)*exp(-max(d,0.)/6.)*(1.-cover);
  return col;
}

void main(){
  // fit the face to the shorter side (portrait screens use width) — fills the whole viewport
  float k  = 1080. / min(uRes.y, uRes.x*1.1);    // reference px per device px
  vec2  p  = (gl_FragCoord.xy - 0.5*uRes) * k;
  p.y -= 22.;                                   // match product-shot centring
  float aa = k * 0.9;
  float t  = uTime / LOOP;

  // ---- sound-wave shells (glassy spheres, rim-lit) ----
  const int N = 3;
  vec2  refr = vec2(0.);
  float light = 0.;
  float pulse = 0.;
  float r = length(p);
  vec2  dir = r > 1e-3 ? p/r : vec2(0.);
  float ang = atan(p.y, p.x);
  for(int i=0; i<N; i++){
    float f = fract(t + float(i)/float(N));
    float R = mix(196., max(1320., length(0.5*uRes)*k*1.05), pow(f, 0.82));  // always clears the corners
    float env = smoothstep(0., 0.10, f) * (1. - smoothstep(0.45, 1., f));
    pulse += smoothstep(0., 0.06, f) * (1. - smoothstep(0.06, 0.32, f));
    float x = r / R;
    float inside = 1. - smoothstep(R - aa*1.5, R + aa*1.5, r);
    float fres = pow(clamp(x, 0., 1.), 12.) * inside;
    float line  = exp(-pow((r - R + 1.2)/(1.4 + aa), 2.));
    float inner = exp(-pow((r - R*0.972)/(4. + R*0.006), 2.)) * inside;
    // brighter on the flanks + a soft top-left highlight, like a lit glass bubble
    float flank = 0.45 + 0.55*pow(abs(cos(ang)), 1.4);
    float key   = 0.75 + 0.5*max(dot(dir, normalize(vec2(-0.6, 0.8))), 0.);
    float s = (fres*0.22 + line*0.55 + inner*0.10) * flank * key * env;
    light += s;
    refr  -= dir * fres * env * 7.;
  }

  vec3 col = face(p + refr, aa, pulse);
  col += vec3(0.93, 0.95, 1.0) * light * 0.75;
  // keep the darks pure black, very soft vignette
  col *= 1. - 0.18*smoothstep(500., 1150., length(p*vec2(0.8,1.)));
  col = pow(col, vec3(0.97));
  gl_FragColor = vec4(col, 1.);
}
`;

const canvas = document.getElementById('gl');
const stage  = document.getElementById('stage');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias:false, alpha:false, powerPreference:'high-performance' });
} catch (e) {
  document.getElementById('fallback').style.display = 'flex';
  throw e;
}
renderer.setClearColor(0x000000, 1);

const scene  = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const uniforms = { uRes:{ value:new THREE.Vector2(1,1) }, uTime:{ value:0 } };
const mat = new THREE.ShaderMaterial({
  uniforms,
  vertexShader: 'void main(){ gl_Position = vec4(position.xy, 0., 1.); }',
  fragmentShader: frag,
  depthTest:false, depthWrite:false,
});
// fwidth needs derivatives in WebGL1; three uses WebGL2 where it is core.
scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat));

// ---------------------------------------------------------------------------
// Chladni sand — background particles (same technique as curation-by.com):
// tens of thousands of points pulled toward the nodal lines of a vibrating
// plate, L(x,y) = a·sin(πnx)·sin(πmy) + b·sin(πmx)·sin(πny). Each step a
// particle moves down the gradient of L², jitters more where the plate moves
// (|L| large) and settles where it is still (L = 0). n, m, a, b drift slowly so
// the figure keeps morphing. Here the driver's wave shells also shake the sand.
// ---------------------------------------------------------------------------
const SAND = {
  count: matchMedia('(pointer: coarse)').matches ? 22000 : 45000,
  color: [138/255, 110/255, 75/255],   // #8A6E4B bronze
  alpha: 1.0,
  size: 1.5,                  // CSS px
};
const sPos = new Float32Array(SAND.count * 2);
const sVel = new Float32Array(SAND.count * 2);
const sAlp = new Float32Array(SAND.count);
const sBase = new Float32Array(SAND.count);
let rngState = 0x9e3779b9;
const rnd = () => { rngState ^= rngState << 13; rngState ^= rngState >>> 17; rngState ^= rngState << 5; return (rngState >>> 0) / 4294967296; };
for (let i = 0; i < SAND.count; i++) {
  sPos[i*2] = rnd()*2 - 1; sPos[i*2+1] = rnd()*2 - 1;
  sBase[i] = 0.25 + rnd()*0.75;
}
const sandGeo = new THREE.BufferGeometry();
const sandPosAttr = new THREE.BufferAttribute(sPos, 2).setUsage(THREE.DynamicDrawUsage);
const sandAlpAttr = new THREE.BufferAttribute(sAlp, 1).setUsage(THREE.DynamicDrawUsage);
sandGeo.setAttribute('position', sandPosAttr);
sandGeo.setAttribute('aAlpha', sandAlpAttr);
sandGeo.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 2);   // 2D points: skip three's 3D bounds calc
const sandUniforms = {
  uSize: { value: SAND.size }, uColor: { value: new THREE.Vector4(...SAND.color, SAND.alpha) },
  uRes: uniforms.uRes,
};
const sandMat = new THREE.RawShaderMaterial({
  uniforms: sandUniforms,
  vertexShader: `
    precision highp float;
    attribute vec2 position; attribute float aAlpha;
    uniform float uSize; uniform vec2 uRes;
    varying float vA;
    void main(){
      gl_Position = vec4(position, 0., 1.);
      gl_PointSize = uSize;
      // fade out around the driver so the sand frames it rather than covers it
      float k = 1080. / min(uRes.y, uRes.x*1.1);
      vec2 p = position * 0.5 * uRes * k; p.y -= 22.;
      vA = aAlpha * smoothstep(275., 380., length(p));
    }`,
  fragmentShader: `
    precision mediump float;
    uniform vec4 uColor; varying float vA;
    void main(){
      vec2 c = 2.*gl_PointCoord - 1.; float d = dot(c,c);
      if (d > 1.) discard;
      gl_FragColor = vec4(uColor.rgb, (1.-d) * vA * uColor.a);
    }`,
  transparent: true, depthTest: false, depthWrite: false, blending: THREE.AdditiveBlending,
});
const sand = new THREE.Points(sandGeo, sandMat);
sand.frustumCulled = false;
sand.renderOrder = 1;
scene.add(sand);

const plate = { n: 3, m: 3, a: 1.2, b: 0.2, seed: 0 };

// ---- pointer: stir the sand (mouse/pen hover, or touch drag) ----
const mouse = { x: 0, y: 0, tx: 0, ty: 0 };
let mouseOn = false;
stage.addEventListener('pointermove', (e) => {
  const r = stage.getBoundingClientRect();
  mouse.tx = ((e.clientX - r.left) / r.width) * 2 - 1;
  mouse.ty = -(((e.clientY - r.top) / r.height) * 2 - 1);
  if (!mouseOn) { mouse.x = mouse.tx; mouse.y = mouse.ty; mouseOn = true; }   // no jump on entry
});
['pointerleave', 'pointercancel'].forEach(t => stage.addEventListener(t, () => { mouseOn = false; }));
stage.addEventListener('pointerup', (e) => { if (e.pointerType === 'touch') mouseOn = false; });

// ---- optional sound: a synthesised bed synced to the wave shells ----
// Each shell emission fires a low "thump" + a soft air burst; a quiet drone sits underneath.
// An AnalyserNode splits it into bass / mid / high bands that drive the Chladni modes
// (bass → n, mid → m, high → a/b), the same mapping curation-by.com uses with their tracks.
// To use a real track instead, connect a MediaElementSource to `audio.bus`.
const audio = { ctx: null, bus: null, master: null, analyser: null, data: null, on: false,
                bands: { bass: 0, mid: 0, high: 0, vol: 0 }, lastBeat: -1 };
function initAudio(){
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const master = ctx.createGain(); master.gain.value = 0;
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -24; comp.ratio.value = 6; comp.attack.value = 0.003; comp.release.value = 0.25;
  const analyser = ctx.createAnalyser(); analyser.fftSize = 256; analyser.smoothingTimeConstant = 0.6;
  const bus = ctx.createGain();
  bus.connect(comp); comp.connect(master); master.connect(analyser); analyser.connect(ctx.destination);
  // drone: two detuned low voices through a lowpass, breathing slowly
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 420; lp.Q.value = 0.7;
  const dg = ctx.createGain(); dg.gain.value = 0.10; lp.connect(dg); dg.connect(bus);
  [[55, 'sine', 0.9], [82.6, 'triangle', 0.35], [110.4, 'sine', 0.25]].forEach(([f, type, g]) => {
    const o = ctx.createOscillator(); o.type = type; o.frequency.value = f;
    const og = ctx.createGain(); og.gain.value = g; o.connect(og); og.connect(lp); o.start();
  });
  const lfo = ctx.createOscillator(); lfo.frequency.value = 1 / LOOP;          // one breath per loop
  const lfoG = ctx.createGain(); lfoG.gain.value = 220; lfo.connect(lfoG); lfoG.connect(lp.frequency); lfo.start();
  // shared noise buffer for the air bursts
  const nb = ctx.createBuffer(1, ctx.sampleRate * 0.6, ctx.sampleRate);
  const ch = nb.getChannelData(0); for (let i = 0; i < ch.length; i++) ch[i] = Math.random()*2 - 1;
  Object.assign(audio, { ctx, bus, master, analyser, data: new Uint8Array(analyser.frequencyBinCount), noise: nb });
}
function beat(){
  const { ctx, bus } = audio, t = ctx.currentTime + 0.01;
  // thump: pitched-down sine
  const o = ctx.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.28);
  const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.75, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.7);
  o.connect(g); g.connect(bus); o.start(t); o.stop(t + 0.75);
  // air: band-passed noise, rising like the shell leaving the dome
  const n = ctx.createBufferSource(); n.buffer = audio.noise;
  const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.4;
  bp.frequency.setValueAtTime(1800, t); bp.frequency.exponentialRampToValueAtTime(6500, t + 0.5);
  const ng = ctx.createGain(); ng.gain.setValueAtTime(0.0001, t);
  ng.gain.exponentialRampToValueAtTime(0.09, t + 0.04); ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);
  n.connect(bp); bp.connect(ng); ng.connect(bus); n.start(t); n.stop(t + 0.6);
}
function syncBeats(loopT){
  if (!audio.on) return;
  const idx = Math.floor((loopT / LOOP) * 3);            // a shell is born every LOOP/3 seconds
  if (audio.lastBeat !== -1 && idx !== audio.lastBeat) beat();
  audio.lastBeat = idx;
}
function readAudio(dt){
  const B = audio.bands, k = Math.min(dt*8, 1);
  let bass = 0, mid = 0, high = 0, vol = 0;
  if (audio.on && audio.analyser) {
    audio.analyser.getByteFrequencyData(audio.data);
    const d = audio.data; let bs = 0, ms = 0, hs = 0, ts = 0;
    for (let i = 0; i < 128; i++) { const v = d[i]; ts += v; if (i < 12) bs += v; else if (i < 55) ms += v; else hs += v; }
    bass = bs / (12*255); mid = ms / (43*255); high = hs / (73*255); vol = ts / (128*255);
  }
  B.bass += (bass - B.bass)*k; B.mid += (mid - B.mid)*k; B.high += (high - B.high)*k; B.vol += (vol - B.vol)*k;
  return { on: audio.on, ...B };
}
const soundBtn = document.getElementById('sound');
soundBtn.addEventListener('click', async () => {
  if (!audio.ctx) initAudio();
  audio.on = !audio.on;
  const { ctx, master } = audio, t = ctx.currentTime;
  if (audio.on) { await ctx.resume(); audio.lastBeat = -1; }
  master.gain.cancelScheduledValues(t);
  master.gain.setValueAtTime(master.gain.value, t);
  master.gain.linearRampToValueAtTime(audio.on ? 0.8 : 0, t + 0.6);
  if (!audio.on) setTimeout(() => { if (!audio.on) ctx.suspend(); }, 700);
  soundBtn.setAttribute('aria-pressed', String(audio.on));
  soundBtn.querySelector('.label').textContent = audio.on ? 'Sound on' : 'Sound off';
});
function stepSand(dt, loopT){
  const W = stage.clientWidth || 1, H = stage.clientHeight || 1;
  const ax = W >= H ? 1 : W/H, ay = W >= H ? H/W : 1;      // keep the figure square
  plate.seed += dt * 0.15;
  const s = plate.seed, lerp = Math.min(dt*4, 1);
  const aud = readAudio(dt);
  if (aud.on) {   // with sound: smaller autonomous drift, the music pushes the modes
    const R = 1.6;
    plate.n += (3 + Math.sin(s*0.4)*1.2 + aud.bass*1.5*R - plate.n) * lerp;
    plate.m += (3 + Math.cos(s*0.7)*1.2 + aud.mid*1.5*R  - plate.m) * lerp;
    plate.a += (1.2 + Math.sin(s*0.5)*0.2 + aud.high*0.6*R - plate.a) * lerp;
    plate.b += (0.2 + Math.cos(s*0.3)*0.2 - aud.high*0.6*R - plate.b) * Math.min(dt*8, 1);
  } else {
    plate.n += (3 + Math.sin(s)*2.5       - plate.n) * lerp;
    plate.m += (3 + Math.cos(s*1.3)*2.5   - plate.m) * lerp;
    plate.a += (1.2 + Math.sin(s*0.7)*0.2 - plate.a) * lerp;
    plate.b += (0.2 + Math.cos(s*0.5)*0.2 - plate.b) * lerp;
  }
  const { n, m, a, b } = plate, pn = Math.PI*n, pm = Math.PI*m;
  if (mouseOn) { const ml = Math.min(dt*15, 1); mouse.x += (mouse.tx - mouse.x)*ml; mouse.y += (mouse.ty - mouse.y)*ml; }
  const mx = mouse.x*ax, my = mouse.y*ay;

  // the driver's wave shells (same maths as the shader) — sand shakes as they pass
  const k = 1080 / Math.min(H, W*1.1);
  const rMax = Math.max(1320, Math.hypot(W/2, H/2)*k*1.05);
  const shells = [];
  let energy = 0;
  for (let i = 0; i < 3; i++) {
    const f = (loopT/LOOP + i/3) % 1;
    const sm = (e0,e1,x) => { const t = Math.min(Math.max((x-e0)/(e1-e0),0),1); return t*t*(3-2*t); };
    const env = sm(0, 0.10, f) * (1 - sm(0.45, 1, f));
    energy += sm(0, 0.06, f) * (1 - sm(0.06, 0.32, f));
    shells.push(196 + (rMax-196)*Math.pow(f, 0.82), env);
  }
  energy += aud.vol * 3.0;
  const u = dt * 0.45;
  const pull = -2 * 0.2 * (1.2 + energy*0.6) * u * (1.1 + energy*1.5);
  const pullX = pull*ax, pullY = pull*ay;
  const vib = (0.08 + energy*0.35) * 0.045, base = 0.001125;
  const halfW = W/2*k, halfH = H/2*k;

  for (let i = 0; i < SAND.count; i++) {
    const i2 = i*2;
    let x = sPos[i2], y = sPos[i2+1];
    const nx = x*ax, ny = y*ay;
    const snx = Math.sin(pn*nx), cnx = Math.cos(pn*nx), smy = Math.sin(pm*ny), cmy = Math.cos(pm*ny);
    const smx = Math.sin(pm*nx), cmx = Math.cos(pm*nx), sny = Math.sin(pn*ny), cny = Math.cos(pn*ny);
    const L  = a*snx*smy + b*smx*sny;
    const Lx = a*pn*cnx*smy + b*pm*cmx*sny;
    const Ly = a*pm*snx*cmy + b*pn*smx*cny;
    let vx = sVel[i2]   + L*Lx*pullX;
    let vy = sVel[i2+1] + L*Ly*pullY;
    if (mouseOn) {   // pointer stirs the sand: tangential push within a small radius
      const dx = nx - mx, dy = ny - my, d2 = dx*dx + dy*dy;
      if (d2 < 0.04) { const rep = (0.04 - d2) * 18; vx += dy*rep; vy -= dx*rep; }
    }
    vx = Math.max(-0.4, Math.min(0.4, vx)) * 0.88;
    vy = Math.max(-0.4, Math.min(0.4, vy)) * 0.88;
    sVel[i2] = vx; sVel[i2+1] = vy;
    const absL = Math.abs(L);
    let jit = base + absL*vib;
    // wave-front kick: extra scatter while a shell's rim sweeps across this grain
    const px = x*halfW, py = y*halfH + 22, r = Math.sqrt(px*px + py*py);
    for (let j = 0; j < 6; j += 2) {
      const d = r - shells[j];
      if (d > -60 && d < 8) jit += 0.006 * shells[j+1] * (1 - Math.abs(d + 26)/34);
    }
    x += vx*u + (rnd() - 0.5)*jit;
    y += vy*u + (rnd() - 0.5)*jit;
    if (x > 1) x = -1; else if (x < -1) x = 1;
    if (y > 1) y = -1; else if (y < -1) y = 1;
    sPos[i2] = x; sPos[i2+1] = y;
    sAlp[i] = sBase[i] * Math.max(0.15, 1 - absL*0.4);
  }
  // keep the figure alive: re-scatter a few grains every half second
  sandTimer += dt;
  if (sandTimer > 0.5) {
    sandTimer = 0;
    for (let j = 0; j < SAND.count*0.005; j++) {
      const idx = (rnd()*SAND.count) | 0;
      sPos[idx*2] = rnd()*2-1; sPos[idx*2+1] = rnd()*2-1; sVel[idx*2] = sVel[idx*2+1] = 0;
    }
  }
  sandPosAttr.needsUpdate = true;
  sandAlpAttr.needsUpdate = true;
}
let sandTimer = 0;

// ---- sizing / DPR (adaptive cap to hold 60fps) ----
let dprCap = 2;
function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, dprCap);
  renderer.setPixelRatio(dpr);
  renderer.setSize(stage.clientWidth, stage.clientHeight, false);
  renderer.getDrawingBufferSize(uniforms.uRes.value);
  sandUniforms.uSize.value = SAND.size * dpr;
  if (!running) render();
}
new ResizeObserver(resize).observe(stage);

// ---- run state: reduced motion, visibility, on-screen ----
const reduceMQ = matchMedia('(prefers-reduced-motion: reduce)');
let inView = true, running = false, raf = 0, last = 0, time = LOOP * 0.28;
const STATIC_T = LOOP * 0.28;  // a frame with shells visible
// ?t=1.2 freezes the loop at that time (handy for stills / QA)
const FREEZE = parseFloat(new URLSearchParams(location.search).get('t'));

function render(){ renderer.render(scene, camera); }

let slow = 0, frames = 0, sandSettled = false;
function tick(now){
  raf = requestAnimationFrame(tick);
  const dt = last ? Math.min((now - last) / 1000, 0.1) : 0;
  last = now;
  time = (time + dt) % LOOP;
  uniforms.uTime.value = time;
  syncBeats(time);
  stepSand(dt, time);
  render();
  // adaptive resolution: if frames are consistently slow, lower the DPR cap
  frames++;
  if (dt > 0.021) slow++;
  if (frames >= 90) {
    if (slow > 45 && dprCap > 1) { dprCap = Math.max(1, dprCap - 0.5); resize(); }
    frames = slow = 0;
  }
}
function update(){
  const frozen = reduceMQ.matches || !isNaN(FREEZE);
  const should = inView && !document.hidden && !frozen;
  if (should && !running) { running = true; last = 0; raf = requestAnimationFrame(tick); }
  else if (!should && running) { running = false; cancelAnimationFrame(raf); }
  // sound follows the animation: silent while off-screen or in a background tab
  if (audio.ctx && audio.on) { if (should) { audio.lastBeat = -1; audio.ctx.resume(); } else audio.ctx.suspend(); }
  if (frozen) {
    uniforms.uTime.value = isNaN(FREEZE) ? STATIC_T : FREEZE % LOOP;
    if (!sandSettled) { for (let i = 0; i < 240; i++) stepSand(1/30, uniforms.uTime.value); sandSettled = true; }
    render();
  }
}
new IntersectionObserver(([e]) => { inView = e.isIntersecting; update(); }).observe(stage);
document.addEventListener('visibilitychange', update);
reduceMQ.addEventListener('change', update);
uniforms.uTime.value = time;
// pre-settle the sand so the figure is already formed on first paint (~0.3 s of work)
for (let i = 0; i < 90; i++) stepSand(1/30, time);
resize();
update();
</script>
